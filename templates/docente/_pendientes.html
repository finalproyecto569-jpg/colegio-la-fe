<article class="tarjeta">
    <div class="tarjeta-cabecera">
        <h2>Lo que tienes pendiente</h2>
        <small>{{ d.pendientes|length }} tarea(s)</small>
    </div>
    <ul class="pendientes">
        {% for p in d.pendientes %}
            <li class="pendiente pendiente-{{ p.tipo }}">
                <span>{{ p.texto }}</span>
                {% if p.destino[1] %}
                    <a href="{{ url_for(p.destino[0], id_curso=p.destino[1]) }}" class="btn btn-primario btn-sm">{{ p.boton }}</a>
                {% else %}
                    <a href="{{ url_for(p.destino[0], grupo='') }}" class="btn btn-primario btn-sm">{{ p.boton }}</a>
                {% endif %}
            </li>
        {% else %}
            <li class="vacio">No tienes nada pendiente.</li>
        {% endfor %}
    </ul>
</article>
